<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Copy Trade Bot - 聪明钱包管理</title>
    <link rel="stylesheet" href="/static/css/styles.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>
    <div class="container mt-4">
        <h1 class="text-center mb-4">Copy Trade Bot - 聪明钱包管理</h1>
        
        <!-- 钱包选择与管理 -->
        <div class="card mb-4">
            <div class="card-header d-flex justify-content-between align-items-center">
                <h5 class="mb-0">钱包列表</h5>
                <button type="button" class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#addWalletModal">
                    <i class="bi bi-plus-circle"></i> 添加钱包
                </button>
            </div>
            <div class="card-body">
                <!-- 钱包选择下拉菜单 -->
                <div class="mb-3">
                    <label for="walletSelect" class="form-label">选择监控钱包</label>
                    <select class="form-select" id="walletSelect">
                        <!-- 钱包选项将通过JS动态加载 -->
                    </select>
                </div>
                
                <!-- 钱包信息卡片 -->
                <div id="walletInfo" class="d-none">
                    <div class="card">
                        <div class="card-body">
                            <h5 class="card-title" id="walletName"></h5>
                            <h6 class="card-subtitle mb-2 text-muted" id="walletAddress"></h6>
                            <p class="card-text">钱包类型: <span id="walletType"></span></p>
                            
                            <div class="row mt-4">
                                <div class="col-md-4">
                                    <div class="form-group">
                                        <label for="takeProfitPct" class="form-label">止盈百分比 (%)</label>
                                        <div class="input-group">
                                            <input type="number" class="form-control" id="takeProfitPct" min="1" value="100">
                                            <span class="input-group-text">%</span>
                                        </div>
                                    </div>
                                </div>
                                <div class="col-md-4">
                                    <div class="form-group">
                                        <label for="stopLossPct" class="form-label">止损百分比 (%)</label>
                                        <div class="input-group">
                                            <input type="number" class="form-control" id="stopLossPct" min="1" value="10">
                                            <span class="input-group-text">%</span>
                                        </div>
                                    </div>
                                </div>
                                <div class="col-md-4">
                                    <div class="form-group">
                                        <label for="exitTimeSec" class="form-label">持仓时间 (秒)</label>
                                        <div class="input-group">
                                            <input type="number" class="form-control" id="exitTimeSec" min="1" value="300">
                                            <span class="input-group-text">秒</span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            
                            <div class="form-check mt-3">
                                <input class="form-check-input" type="checkbox" id="walletEnabled" checked>
                                <label class="form-check-label" for="walletEnabled">
                                    启用此钱包监控
                                </label>
                            </div>
                            
                            <div class="d-flex justify-content-end mt-3">
                                <button type="button" class="btn btn-danger me-2" id="deleteWalletBtn">
                                    <i class="bi bi-trash"></i> 删除钱包
                                </button>
                                <button type="button" class="btn btn-primary" id="updateWalletBtn">
                                    <i class="bi bi-save"></i> 保存更改
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
                
                <!-- 无钱包提示 -->
                <div id="noWalletAlert" class="alert alert-warning d-none">
                    没有可用的钱包。请添加一个新钱包。
                </div>
            </div>
        </div>
        
        <!-- 交易开关设置 -->
        <div class="card mb-4">
            <div class="card-header d-flex justify-content-between align-items-center">
                <h5 class="mb-0">交易开关设置</h5>
            </div>
            <div class="card-body">
                <div class="row">
                    <div class="col-md-4">
                        <div class="form-check form-switch">
                            <input class="form-check-input" type="checkbox" id="pumpTradeEnable">
                            <label class="form-check-label" for="pumpTradeEnable">
                                Pump 交易开关
                            </label>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="form-check form-switch">
                            <input class="form-check-input" type="checkbox" id="pumpammTradeEnable">
                            <label class="form-check-label" for="pumpammTradeEnable">
                                Pump AMM 交易开关
                            </label>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="form-check form-switch">
                            <input class="form-check-input" type="checkbox" id="raydiumTradeEnable">
                            <label class="form-check-label" for="raydiumTradeEnable">
                                Raydium 交易开关
                            </label>
                        </div>
                    </div>
                </div>
                <div class="row mt-3">
                    <div class="col-md-6">
                        <div class="form-group">
                            <label for="minPoolSize" class="form-label">最小池子大小</label>
                            <div class="input-group">
                                <input type="number" class="form-control" id="minPoolSize" min="0" step="0.1">
                                <span class="input-group-text">SOL</span>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-group">
                            <label for="maxPoolSize" class="form-label">最大池子大小</label>
                            <div class="input-group">
                                <input type="number" class="form-control" id="maxPoolSize" min="0" step="0.1">
                                <span class="input-group-text">SOL</span>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="row mt-3">
                    <div class="col-md-6">
                        <div class="form-group">
                            <label for="minFollowTriggerAmount" class="form-label">最小触发买入数量</label>
                            <div class="input-group">
                                <input type="number" class="form-control" id="minFollowTriggerAmount" min="0" step="0.0001">
                                <span class="input-group-text">SOL</span>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-group">
                            <label for="maxFollowTriggerAmount" class="form-label">最大触发买入数量</label>
                            <div class="input-group">
                                <input type="number" class="form-control" id="maxFollowTriggerAmount" min="0" step="0.1">
                                <span class="input-group-text">SOL</span>
                            </div>
                        </div>
                    </div>
                </div>
                
                <h5 class="mt-4 mb-3">交易参数设置</h5>
                <h6 class="mb-2">买入参数</h6>
                <div class="row">
                    <div class="col-md-3">
                        <div class="form-group">
                            <label for="buySlippage" class="form-label">买入滑点</label>
                            <div class="input-group">
                                <input type="number" class="form-control" id="buySlippage" min="0" max="1" step="0.01">
                                <span class="input-group-text">%</span>
                            </div>
                            <small class="form-text text-muted">范围: 0-1 (0-100%)</small>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="form-group">
                            <label for="buyPriorityFee" class="form-label">买入优先级费用</label>
                            <div class="input-group">
                                <input type="number" class="form-control" id="buyPriorityFee" min="0" step="0.0001">
                                <span class="input-group-text">SOL</span>
                            </div>
                            <small class="form-text text-muted">交易优先级费用</small>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="form-group">
                            <label for="buyTipFee" class="form-label">买入Tip费用</label>
                            <div class="input-group">
                                <input type="number" class="form-control" id="buyTipFee" min="0" step="0.0001">
                                <span class="input-group-text">SOL</span>
                            </div>
                            <small class="form-text text-muted">给验证者的额外奖励</small>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="form-group">
                            <label for="buySolAmount" class="form-label">买入金额</label>
                            <div class="input-group">
                                <input type="number" class="form-control" id="buySolAmount" min="0" step="0.0001">
                                <span class="input-group-text">SOL</span>
                            </div>
                        </div>
                    </div>
                </div>

                <h6 class="mt-4 mb-2">卖出参数</h6>
                <div class="row">
                    <div class="col-md-4">
                        <div class="form-group">
                            <label for="sellSlippage" class="form-label">卖出滑点</label>
                            <div class="input-group">
                                <input type="number" class="form-control" id="sellSlippage" min="0" max="1" step="0.01">
                                <span class="input-group-text">%</span>
                            </div>
                            <small class="form-text text-muted">范围: 0-1 (0-100%)</small>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="form-group">
                            <label for="sellPriorityFee" class="form-label">卖出优先级费用</label>
                            <div class="input-group">
                                <input type="number" class="form-control" id="sellPriorityFee" min="0" step="0.0001">
                                <span class="input-group-text">SOL</span>
                            </div>
                            <small class="form-text text-muted">交易优先级费用</small>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="form-group">
                            <label for="sellTipFee" class="form-label">卖出Tip费用</label>
                            <div class="input-group">
                                <input type="number" class="form-control" id="sellTipFee" min="0" step="0.0001">
                                <span class="input-group-text">SOL</span>
                            </div>
                            <small class="form-text text-muted">给验证者的额外奖励</small>
                        </div>
                    </div>
                </div>
                <div class="d-flex justify-content-end mt-3">
                    <button type="button" class="btn btn-primary" id="saveTradeSettingsBtn">
                        <i class="bi bi-save"></i> 保存交易设置
                    </button>
                </div>
            </div>
        </div>
        
        <!-- 状态提示 -->
        <div class="alert alert-success mt-3 d-none" id="successAlert">
            操作成功！
        </div>
        
        <div class="alert alert-danger mt-3 d-none" id="errorAlert">
            操作失败！请检查输入并重试。
        </div>
    </div>

    <!-- 添加钱包模态框 -->
    <div class="modal fade" id="addWalletModal" tabindex="-1" aria-labelledby="addWalletModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="addWalletModalLabel">添加新钱包</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="addWalletForm">
                        <div class="mb-3">
                            <label for="newWalletAddress" class="form-label">钱包地址</label>
                            <input type="text" class="form-control" id="newWalletAddress" required>
                            <div class="form-text">输入有效的Solana钱包地址</div>
                        </div>
                        <div class="mb-3">
                            <label for="newWalletName" class="form-label">钱包名称</label>
                            <input type="text" class="form-control" id="newWalletName" required>
                        </div>
                        <div class="mb-3">
                            <label for="newWalletType" class="form-label">钱包类型</label>
                            <select class="form-select" id="newWalletType" required>
                                <option value="high_frequency">高频交易</option>
                                <option value="low_frequency">低频交易</option>
                            </select>
                        </div>
                        <div class="row">
                            <div class="col-md-4">
                                <div class="mb-3">
                                    <label for="newTakeProfitPct" class="form-label">止盈 (%)</label>
                                    <input type="number" class="form-control" id="newTakeProfitPct" min="1" value="100" required>
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="mb-3">
                                    <label for="newStopLossPct" class="form-label">止损 (%)</label>
                                    <input type="number" class="form-control" id="newStopLossPct" min="1" value="10" required>
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="mb-3">
                                    <label for="newExitTimeSec" class="form-label">持仓时间 (秒)</label>
                                    <input type="number" class="form-control" id="newExitTimeSec" min="1" value="300" required>
                                </div>
                            </div>
                        </div>
                        <div class="form-check mb-3">
                            <input class="form-check-input" type="checkbox" id="newWalletEnabled" checked>
                            <label class="form-check-label" for="newWalletEnabled">
                                启用此钱包监控
                            </label>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-primary" id="saveNewWalletBtn">添加钱包</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/script.js"></script>
</body>
</html>
