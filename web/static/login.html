<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="login.title">Copy Trade Bot - 登录</title>
    <link rel="stylesheet" href="/static/css/styles.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #0d47a1, #1565c0, #1976d2);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Poppins', sans-serif;
        }
        .login-container {
            max-width: 450px;
            width: 90%;
            margin: 20px auto;
        }
        .login-card {
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            overflow: hidden;
            background-color: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.18);
        }
        .login-header {
            background: linear-gradient(135deg, #2196f3, #0d47a1);
            color: white;
            padding: 25px 20px;
            border-radius: 16px 16px 0 0;
            position: relative;
        }
        .login-header h3 {
            font-weight: 600;
            margin-bottom: 5px;
        }
        .login-header p {
            opacity: 0.9;
        }
        .login-logo {
            width: 80px;
            height: 80px;
            background-color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        .login-logo i {
            font-size: 40px;
            color: #2196f3;
        }
        .login-body {
            padding: 30px;
        }
        .form-label {
            font-weight: 500;
            color: #333;
            margin-bottom: 8px;
        }
        .input-group-lg .form-control {
            border-radius: 8px;
            border: 2px solid #e0e0e0;
            padding: 12px 16px;
            transition: all 0.3s ease;
        }
        .input-group-lg .form-control:focus {
            border-color: #2196f3;
            box-shadow: 0 0 0 0.2rem rgba(33, 150, 243, 0.25);
        }
        .input-group-text {
            background-color: #f5f5f5;
            border: 2px solid #e0e0e0;
            border-right: none;
            border-radius: 8px 0 0 8px;
        }
        .input-group-lg .form-control {
            border-left: none;
            border-radius: 0 8px 8px 0;
        }
        .btn-login {
            background: linear-gradient(135deg, #2196f3, #0d47a1);
            border: none;
            padding: 12px;
            font-weight: 600;
            font-size: 16px;
            border-radius: 8px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(33, 150, 243, 0.3);
        }
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(33, 150, 243, 0.4);
        }
        .form-check-input:checked {
            background-color: #2196f3;
            border-color: #2196f3;
        }
        .alert {
            border-radius: 8px;
            border: none;
        }
        .language-switcher {
            position: absolute;
            top: 15px;
            right: 15px;
            display: flex;
            gap: 5px;
        }
        .language-switcher button {
            background-color: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 5px 12px;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .language-switcher button:hover {
            background-color: rgba(255, 255, 255, 0.3);
        }
        .language-switcher button.active {
            background-color: white;
            color: #2196f3;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header text-center">
                <!-- 语言切换按钮 -->
                <div class="language-switcher">
                    <button data-lang-switch="zh" class="active">中文</button>
                    <button data-lang-switch="en">English</button>
                </div>
                
                <div class="login-logo">
                    <i class="bi bi-robot"></i>
                </div>
                <h3 data-i18n="app.title">Copy Trade Bot</h3>
                <p data-i18n="login.title">登录</p>
            </div>
            
            <div class="login-body">
                <div id="errorAlert" class="alert alert-danger d-none" role="alert">
                    <i class="bi bi-exclamation-triangle-fill me-2"></i>
                    <span data-i18n="login.error">用户名或密码错误</span>
                </div>
                
                <form id="loginForm" class="mt-4">
                    <div class="mb-4">
                        <label for="username" class="form-label" data-i18n="login.username">用户名</label>
                        <div class="input-group input-group-lg shadow-sm">
                            <span class="input-group-text">
                                <i class="bi bi-person-fill text-primary"></i>
                            </span>
                            <input 
                                type="text" 
                                class="form-control" 
                                id="username" 
                                name="username" 
                                required
                                data-i18n-placeholder="login.username"
                                placeholder="用户名"
                            >
                        </div>
                    </div>
                    
                    <div class="mb-4">
                        <label for="password" class="form-label" data-i18n="login.password">密码</label>
                        <div class="input-group input-group-lg shadow-sm">
                            <span class="input-group-text">
                                <i class="bi bi-lock-fill text-primary"></i>
                            </span>
                            <input 
                                type="password" 
                                class="form-control" 
                                id="password" 
                                name="password" 
                                required
                                data-i18n-placeholder="login.password"
                                placeholder="密码"
                            >
                        </div>
                    </div>
                    
                    <div class="form-check mb-4">
                        <input class="form-check-input" type="checkbox" id="rememberMe">
                        <label class="form-check-label" for="rememberMe" data-i18n="login.remember">
                            记住我
                        </label>
                    </div>
                    
                    <button type="submit" class="btn btn-primary btn-login w-100" data-i18n="login.submit">
                        登录
                    </button>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/i18n.js"></script>
    <script>
        // 更新语言切换按钮状态
        function updateLanguageButtons() {
            const currentLang = i18n.getCurrentLang();
            document.querySelectorAll('[data-lang-switch]').forEach(button => {
                const lang = button.getAttribute('data-lang-switch');
                if (lang === currentLang) {
                    button.classList.add('active');
                } else {
                    button.classList.remove('active');
                }
            });
        }

        // 监听语言变更事件
        window.addEventListener('languageChanged', () => {
            updateLanguageButtons();
        });

        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', () => {
            updateLanguageButtons();
        });

        // 登录表单提交
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const rememberMe = document.getElementById('rememberMe').checked;
            
            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ username, password, rememberMe })
                });
                
                if (response.ok) {
                    const data = await response.json();
                    localStorage.setItem('auth_token', data.token);
                    window.location.href = '/dashboard';
                } else {
                    document.getElementById('errorAlert').classList.remove('d-none');
                    setTimeout(() => {
                        document.getElementById('errorAlert').classList.add('d-none');
                    }, 3000);
                }
            } catch (error) {
                console.error('Login error:', error);
                alert(i18n.t('msg.network_error'));
            }
        });
    </script>
</body>
</html>
