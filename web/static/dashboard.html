<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BeyondJeet CopyTrade - 控制面板</title>
    <link rel="stylesheet" href="/static/css/styles.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>
    <!-- 顶部导航栏 -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="#">BeyondJeet CopyTrade</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="#"></a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#" id="walletManagementLink">钱包管理</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#" id="paramSchemeLink">参数模板</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#" id="tradeSettingsLink">交易设置</a>
                    </li>
                </ul>
                <div class="d-flex align-items-center">
                    <span class="text-light me-3" id="currentUser"></span>
                    <button class="btn btn-outline-light" id="logoutBtn">
                        <i class="bi bi-box-arrow-right"></i> 退出
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <!-- 钱包选择与管理 -->
        <div class="card mb-4" id="walletManagementSection">
            <div class="card-header d-flex justify-content-between align-items-center">
                <h5 class="mb-0">钱包列表</h5>
                <button type="button" class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#addWalletModal">
                    <i class="bi bi-plus-circle"></i> 添加钱包
                </button>
            </div>
            <div class="card-body">
                <!-- 钱包选择下拉菜单 -->
                <div class="mb-3">
                    <label for="walletSelect" class="form-label">选择监控钱包</label>
                    <select class="form-select" id="walletSelect">
                        <!-- 钱包选项将通过JS动态加载 -->
                    </select>
                </div>
                
                <!-- 钱包信息卡片 -->
                <div id="walletInfo" class="d-none">
                    <div class="card">
                        <div class="card-body">
                            <h5 class="card-title" id="walletName"></h5>
                            <h6 class="card-subtitle mb-2 text-muted" id="walletAddress"></h6>
                            <p class="card-text">钱包类型: <span id="walletType"></span></p>
                            
                            <!-- 参数模板绑定 -->
                            <div class="form-group mb-3">
                                <label for="walletParamScheme" class="form-label"><i class="bi bi-link-45deg me-1"></i> 绑定参数模板</label>
                                <select class="form-select" id="walletParamScheme">
                                    <option value="">不绑定参数模板</option>
                                    <!-- 参数模板选项将通过JS动态加载 -->
                                </select>
                                <div class="form-text">绑定后，该钱包将使用选定参数模板的交易设置</div>
                            </div>
                            
                            <div class="row mt-4">
                                <div class="col-md-4">
                                    <div class="form-group">
                                        <label for="takeProfitPct" class="form-label">止盈百分比 (%)</label>
                                        <div class="input-group">
                                            <input type="number" class="form-control" id="takeProfitPct" min="1" value="100">
                                            <span class="input-group-text">%</span>
                                        </div>
                                    </div>
                                </div>
                                <div class="col-md-4">
                                    <div class="form-group">
                                        <label for="stopLossPct" class="form-label">止损百分比 (%)</label>
                                        <div class="input-group">
                                            <input type="number" class="form-control" id="stopLossPct" min="1" value="10">
                                            <span class="input-group-text">%</span>
                                        </div>
                                    </div>
                                </div>
                                <div class="col-md-4">
                                    <div class="form-group">
                                        <div class="input-group">
                                            <input type="hidden" class="form-control" id="exitTimeSec" min="1" value="300">
                                          
                                        </div>
                                    </div>
                                </div>
                            </div>
                            
                            <div class="form-check mt-3">
                                <input class="form-check-input" type="checkbox" id="walletEnabled" checked>
                                <label class="form-check-label" for="walletEnabled">
                                    启用此钱包监控
                                </label>
                            </div>
                            
                            <div class="form-check mt-2">
                                <input class="form-check-input" type="checkbox" id="walletFollowSell" checked>
                                <label class="form-check-label" for="walletFollowSell">
                                    <i class="bi bi-arrow-down-circle"></i> 启用跟卖功能
                                </label>
                                <div class="form-text">启用后，当监控钱包卖出代币时，将自动按比例卖出</div>
                            </div>
                            
                            <div class="mt-4">
                                <button type="button" class="btn btn-danger me-2" id="deleteWalletBtn">
                                    <i class="bi bi-trash"></i> 删除钱包
                                </button>
                                <button type="button" class="btn btn-primary" id="updateWalletBtn">
                                    <i class="bi bi-save"></i> 保存更改
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
                
                <!-- 无钱包提示 -->
                <div id="noWalletAlert" class="alert alert-warning d-none">
                    没有可用的钱包。请添加一个新钱包。
                </div>
            </div>
        </div>
        
        <!-- 参数模板管理 -->
        <div class="card mb-4" id="paramSchemeSection">
            <div class="card-header d-flex justify-content-between align-items-center">
                <h5 class="mb-0">参数模板管理</h5>
                <button type="button" class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#addSchemeModal">
                    <i class="bi bi-plus-circle"></i> 创建新模板
                </button>
            </div>
            <div class="card-body">
                <!-- 参数模板选择下拉菜单 -->
                <div class="mb-3">
                    <label for="schemeSelect" class="form-label">选择参数模板</label>
                    <select class="form-select" id="schemeSelect">
                        <!-- 参数模板选项将通过JS动态加载 -->
                    </select>
                </div>
                
                <!-- 参数模板信息卡片 -->
                <div id="schemeInfo" class="d-none">
                    <!-- 基本信息卡片 -->
                    <div class="card mb-4 border-primary">
                        <div class="card-header bg-primary bg-opacity-10 d-flex justify-content-between align-items-center">
                            <h6 class="mb-0"><i class="bi bi-info-circle me-2"></i>基本信息</h6>
                            <span class="badge bg-primary" id="schemeId"></span>
                        </div>
                        <div class="card-body">
                            <h5 class="card-title" id="schemeName"></h5>
                            <p class="card-text text-muted" id="schemeDescription"></p>
                        </div>
                    </div>
                    
                    <!-- 交易触发参数卡片 -->
                    <div class="card mb-4 border-info">
                        <div class="card-header bg-info bg-opacity-10">
                            <h6 class="mb-0"><i class="bi bi-lightning-charge me-2"></i>交易触发参数</h6>
                        </div>
                        <div class="card-body">
                            <div class="row">
                             
                                <div class="col-md-4">
                                    <div class="form-group mb-3">
                                        <label for="schemeMinFollowTriggerAmount" class="form-label">最小跟单触发金额</label>
                                        <div class="input-group">
                                            <span class="input-group-text"><i class="bi bi-currency-dollar"></i></span>
                                            <input type="number" class="form-control" id="schemeMinFollowTriggerAmount" min="0" step="0.01">
                                        </div>
                                    </div>
                                </div>
                                <div class="col-md-4">
                                    <div class="form-group mb-3">
                                        <label for="schemeMaxFollowTriggerAmount" class="form-label">最大跟单触发金额</label>
                                        <div class="input-group">
                                            <span class="input-group-text"><i class="bi bi-currency-dollar"></i></span>
                                            <input type="number" class="form-control" id="schemeMaxFollowTriggerAmount" min="0" step="0.01">
                                        </div>
                                    </div>
                                </div>
                            </div>
                            
                            <div class="row">
                                <div class="col-md-4">
                                    <div class="form-group mb-3">
                                        <label for="schemeMinPoolSize" class="form-label">最小池子大小 (SOL)</label>
                                        <div class="input-group">
                                            <span class="input-group-text"><i class="bi bi-water"></i></span>
                                            <input type="number" class="form-control" id="schemeMinPoolSize" min="0" step="0.1">
                                        </div>
                                    </div>
                                </div>
                                <div class="col-md-4">
                                    <div class="form-group mb-3">
                                        <label for="schemeMaxPoolSize" class="form-label">最大池子大小 (SOL)</label>
                                        <div class="input-group">
                                            <span class="input-group-text"><i class="bi bi-water"></i></span>
                                            <input type="number" class="form-control" id="schemeMaxPoolSize" min="0" step="0.1">
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <!-- 买入参数卡片 -->
                    <div class="card mb-4 border-success">
                        <div class="card-header bg-success bg-opacity-10">
                            <h6 class="mb-0"><i class="bi bi-cart-plus me-2 text-success"></i>买入参数</h6>
                        </div>
                        <div class="card-body">
                            <div class="row">
                                <div class="col-md-4">
                                    <div class="form-group mb-3">
                                        <label for="schemeBuySolAmount" class="form-label">购买金额 (SOL)</label>
                                        <div class="input-group">
                                            <span class="input-group-text"><i class="bi bi-currency-dollar"></i></span>
                                            <input type="number" class="form-control" id="schemeBuySolAmount" min="0" step="0.01">
                                        </div>
                                    </div>
                                </div>
                                <div class="col-md-4">
                                    <div class="form-group mb-3">
                                        <label for="schemeBuySlippage" class="form-label">买入滑点 (0-1)</label>
                                        <div class="input-group">
                                            <span class="input-group-text"><i class="bi bi-sliders"></i></span>
                                            <input type="number" class="form-control" id="schemeBuySlippage" min="0" step="0.1">
                                            <span class="input-group-text"></span>
                                        </div>
                                    </div>
                                </div>
                         
                         
                            </div>
                            
                            <div class="row">
                             
                                <div class="col-md-4">
                                    <div class="form-group mb-3">
                                        <label for="schemeBuyPriorityFee" class="form-label">买入优先费</label>
                                        <div class="input-group">
                                            <span class="input-group-text"><i class="bi bi-lightning-charge"></i></span>
                                            <input type="number" class="form-control" id="schemeBuyPriorityFee" min="0">
                                        </div>
                                    </div>
                                </div>
                                <div class="col-md-4">
                                    <div class="form-group mb-3">
                                        <label for="schemeBuyTipFee" class="form-label">买入小费</label>
                                        <div class="input-group">
                                            <span class="input-group-text"><i class="bi bi-coin"></i></span>
                                            <input type="number" class="form-control" id="schemeBuyTipFee" min="0">
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <!-- 卖出参数卡片 -->
                    <div class="card mb-4 border-danger">
                        <div class="card-header bg-danger bg-opacity-10">
                            <h6 class="mb-0"><i class="bi bi-cart-dash me-2 text-danger"></i>卖出参数</h6>
                        </div>
                        <div class="card-body">
                            <div class="row">
                                <div class="col-md-4">
                                    <div class="form-group mb-3">
                                        <label for="schemeSellDelayTime" class="form-label">卖出延迟时间 (毫秒)</label>
                                        <div class="input-group">
                                            <span class="input-group-text"><i class="bi bi-clock"></i></span>
                                            <input type="number" class="form-control" id="schemeSellDelayTime" min="0">
                                        </div>
                                    </div>
                                </div>
                                <div class="col-md-4">
                                    <div class="form-group mb-3">
                                        <label for="schemeSellSlippage" class="form-label">卖出滑点 (0-1)</label>
                                        <div class="input-group">
                                            <span class="input-group-text"><i class="bi bi-sliders"></i></span>
                                            <input type="number" class="form-control" id="schemeSellSlippage" min="0" step="0.1">
                                            <span class="input-group-text"></span>
                                        </div>
                                    </div>
                                </div>
                           
                             
                            </div>
                            
                            <div class="row">
                              
                                <div class="col-md-4">
                                    <div class="form-group mb-3">
                                        <label for="schemeSellPriorityFee" class="form-label">卖出优先费</label>
                                        <div class="input-group">
                                            <span class="input-group-text"><i class="bi bi-lightning-charge"></i></span>
                                            <input type="number" class="form-control" id="schemeSellPriorityFee" min="0">
                                        </div>
                                    </div>
                                </div>
                                <div class="col-md-4">
                                    <div class="form-group mb-3">
                                        <label for="schemeSellTipFee" class="form-label">卖出小费</label>
                                        <div class="input-group">
                                            <span class="input-group-text"><i class="bi bi-coin"></i></span>
                                            <input type="number" class="form-control" id="schemeSellTipFee" min="0">
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="form-check mb-4">
                        <input class="form-check-input" type="checkbox" id="schemeIsDefault">
                        <label class="form-check-label" for="schemeIsDefault">
                            <i class="bi bi-star-fill text-warning me-1"></i> 设为默认参数模板
                        </label>
                    </div>
                    
                    <div class="d-flex justify-content-end">
                        <button type="button" class="btn btn-danger me-2" id="deleteSchemeBtn">
                            <i class="bi bi-trash"></i> 删除模板
                        </button>
                        <button type="button" class="btn btn-primary" id="updateSchemeBtn">
                            <i class="bi bi-save"></i> 保存更改
                        </button>
                    </div>
                </div>
                
                <!-- 无参数模板提示 -->
                <div id="noSchemeAlert" class="alert alert-warning d-none">
                    没有可用的参数模板。请创建一个新模板。
                </div>
            </div>
        </div>
        
        <!-- 交易开关设置 -->
        <div class="card mb-4" id="tradeSettingsSection">
            <div class="card-header bg-primary bg-opacity-10 d-flex justify-content-between align-items-center">
                <h5 class="mb-0"><i class="bi bi-toggles me-2"></i>交易开关设置</h5>
            </div>
            <div class="card-body">
                <div class="row row-cols-1 row-cols-md-3 g-4">
                    <div class="col">
                        <div class="card h-100 border-primary">
                            <div class="card-body d-flex align-items-center">
                                <div class="form-check form-switch">
                                    <input class="form-check-input" type="checkbox" id="pumpTradeEnable">
                                    <label class="form-check-label" for="pumpTradeEnable">
                                        <i class="bi bi-currency-exchange me-2 text-primary"></i>Pump 交易开关
                                    </label>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col">
                        <div class="card h-100 border-info">
                            <div class="card-body d-flex align-items-center">
                                <div class="form-check form-switch">
                                    <input class="form-check-input" type="checkbox" id="pumpAmmTradeEnable">
                                    <label class="form-check-label" for="pumpAmmTradeEnable">
                                        <i class="bi bi-currency-exchange me-2 text-info"></i>Pump AMM 交易开关
                                    </label>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col">
                        <div class="card h-100 border-success">
                            <div class="card-body d-flex align-items-center">
                                <div class="form-check form-switch">
                                    <input class="form-check-input" type="checkbox" id="raydiumTradeEnable">
                                    <label class="form-check-label" for="raydiumTradeEnable">
                                        <i class="bi bi-currency-exchange me-2 text-success"></i>Raydium 交易开关
                                    </label>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col">
                        <div class="card h-100 border-warning">
                            <div class="card-body d-flex align-items-center">
                                <div class="form-check form-switch">
                                    <input class="form-check-input" type="checkbox" id="launchpadTradeEnable">
                                    <label class="form-check-label" for="launchpadTradeEnable">
                                        <i class="bi bi-currency-exchange me-2 text-warning"></i>bonk 交易开关
                                    </label>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col">
                        <div class="card h-100 border-danger">
                            <div class="card-body d-flex align-items-center">
                                <div class="form-check form-switch">
                                    <input class="form-check-input" type="checkbox" id="repeatTradeEnable">
                                    <label class="form-check-label" for="repeatTradeEnable">
                                        <i class="bi bi-arrow-repeat me-2 text-danger"></i>重复交易开关
                                    </label>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="mt-4 d-flex justify-content-end">
                    <button type="button" class="btn btn-primary" id="saveTradeSettingsBtn">
                        <i class="bi bi-save"></i> 保存交易设置
                    </button>
                </div>
            </div>
        </div>
        
        <div class="alert alert-success mt-3 d-none" id="successAlert">
            操作成功！
        </div>
        
        <div class="alert alert-danger mt-3 d-none" id="errorAlert">
            操作失败！请检查输入并重试。
        </div>
    </div>

    <!-- 添加钱包模态框 -->
    <div class="modal fade" id="addWalletModal" tabindex="-1" aria-labelledby="addWalletModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="addWalletModalLabel">添加新钱包</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="addWalletForm">
                        <div class="mb-3">
                            <label for="newWalletAddress" class="form-label">钱包地址</label>
                            <input type="text" class="form-control" id="newWalletAddress" required>
                            <div class="form-text">输入有效的Solana钱包地址</div>
                        </div>
                        <div class="mb-3">
                            <label for="newWalletName" class="form-label">钱包名称</label>
                            <input type="text" class="form-control" id="newWalletName" required>
                        </div>
                        <div class="mb-3">
                            <label for="newWalletType" class="form-label">钱包类型</label>
                            <select class="form-select" id="newWalletType" required>
                                <option value="high_frequency">高频交易</option>
                                <option value="low_frequency">低频交易</option>
                            </select>
                        </div>
                        <div class="row">
                            <div class="col-md-4">
                                <div class="mb-3">
                                    <label for="newTakeProfitPct" class="form-label">止盈 (%)</label>
                                    <input type="number" class="form-control" id="newTakeProfitPct" min="1" value="100" required>
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="mb-3">
                                    <label for="newStopLossPct" class="form-label">止损 (%)</label>
                                    <input type="number" class="form-control" id="newStopLossPct" min="1" value="10" required>
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="mb-3">
                                    <label for="newExitTimeSec" class="form-label">持仓时间 (秒)</label>
                                    <input type="number" class="form-control" id="newExitTimeSec" min="1" value="300" required>
                                </div>
                            </div>
                        </div>
                        <div class="form-check mb-3">
                            <input class="form-check-input" type="checkbox" id="newWalletEnabled" checked>
                            <label class="form-check-label" for="newWalletEnabled">
                                启用此钱包监控
                            </label>
                        </div>
                        <div class="form-check mb-3">
                            <input class="form-check-input" type="checkbox" id="newWalletFollowSell" checked>
                            <label class="form-check-label" for="newWalletFollowSell">
                                <i class="bi bi-arrow-down-circle"></i> 启用跟卖功能
                            </label>
                            <div class="form-text">启用后，当监控钱包卖出代币时，将自动按比例卖出</div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-primary" id="saveNewWalletBtn">添加钱包</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 添加参数模板模态框 -->
    <div class="modal fade" id="addSchemeModal" tabindex="-1" aria-labelledby="addSchemeModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title" id="addSchemeModalLabel"><i class="bi bi-gear-fill me-2"></i>创建新参数模板</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="newSchemeForm">
                        <!-- 基本信息卡片 -->
                        <div class="card mb-4 border-primary">
                            <div class="card-header bg-primary bg-opacity-10">
                                <h6 class="mb-0"><i class="bi bi-info-circle me-2"></i>基本信息</h6>
                            </div>
                            <div class="card-body">
                                <div class="row">
                                    <div class="col-md-6">
                                        <div class="mb-3">
                                            <label for="newSchemeName" class="form-label">模板名称</label>
                                            <div class="input-group">
                                                <span class="input-group-text"><i class="bi bi-tag"></i></span>
                                                <input type="text" class="form-control" id="newSchemeName" required>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="col-md-6">
                                        <div class="mb-3">
                                            <label for="newSchemeDescription" class="form-label">模板描述</label>
                                            <div class="input-group">
                                                <span class="input-group-text"><i class="bi bi-card-text"></i></span>
                                                <input type="text" class="form-control" id="newSchemeDescription">
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        
                        <!-- 交易触发参数卡片 -->
                        <div class="card mb-4 border-info">
                            <div class="card-header bg-info bg-opacity-10">
                                <h6 class="mb-0"><i class="bi bi-lightning-charge me-2"></i>交易触发参数</h6>
                            </div>
                            <div class="card-body">
                                <div class="row">
                                 
                                    <div class="col-md-4">
                                        <div class="mb-3">
                                            <label for="newSchemeMinFollowTriggerAmount" class="form-label">最小跟单触发金额</label>
                                            <div class="input-group">
                                                <span class="input-group-text"><i class="bi bi-currency-dollar"></i></span>
                                                <input type="number" class="form-control" id="newSchemeMinFollowTriggerAmount" min="0" step="0.01" value="0.1">
                                            </div>
                                        </div>
                                    </div>
                                    <div class="col-md-4">
                                        <div class="mb-3">
                                            <label for="newSchemeMaxFollowTriggerAmount" class="form-label">最大跟单触发金额</label>
                                            <div class="input-group">
                                                <span class="input-group-text"><i class="bi bi-currency-dollar"></i></span>
                                                <input type="number" class="form-control" id="newSchemeMaxFollowTriggerAmount" min="0" step="0.01" value="10">
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                
                                <div class="row">
                                    <div class="col-md-4">
                                        <div class="mb-3">
                                            <label for="newSchemeMinPoolSize" class="form-label">最小池子大小 (SOL)</label>
                                            <div class="input-group">
                                                <span class="input-group-text"><i class="bi bi-water"></i></span>
                                                <input type="number" class="form-control" id="newSchemeMinPoolSize" min="0" step="0.1" value="1">
                                            </div>
                                        </div>
                                    </div>
                                    <div class="col-md-4">
                                        <div class="mb-3">
                                            <label for="newSchemeMaxPoolSize" class="form-label">最大池子大小 (SOL)</label>
                                            <div class="input-group">
                                                <span class="input-group-text"><i class="bi bi-water"></i></span>
                                                <input type="number" class="form-control" id="newSchemeMaxPoolSize" min="0" step="0.1" value="100">
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        
                        <!-- 买入参数卡片 -->
                        <div class="card mb-4 border-success">
                            <div class="card-header bg-success bg-opacity-10">
                                <h6 class="mb-0"><i class="bi bi-cart-plus me-2 text-success"></i>买入参数</h6>
                            </div>
                            <div class="card-body">
                                <div class="row">
                                    <div class="col-md-4">
                                        <div class="mb-3">
                                            <label for="newSchemeBuySolAmount" class="form-label">购买金额 (SOL)</label>
                                            <div class="input-group">
                                                <span class="input-group-text"><i class="bi bi-currency-dollar"></i></span>
                                                <input type="number" class="form-control" id="newSchemeBuySolAmount" min="0" step="0.01" value="0.5">
                                            </div>
                                        </div>
                                    </div>
                                    <div class="col-md-4">
                                        <div class="mb-3">
                                            <label for="newSchemeBuySlippage" class="form-label">买入滑点 (0-1)</label>
                                            <div class="input-group">
                                                <span class="input-group-text"><i class="bi bi-sliders"></i></span>
                                                <input type="number" class="form-control" id="newSchemeBuySlippage" min="0" step="0.1" value="1">
                                                <span class="input-group-text"></span>
                                            </div>
                                        </div>
                                    </div>

                                </div>
                                
                                <div class="row">
                                
                                    <div class="col-md-4">
                                        <div class="mb-3">
                                            <label for="newSchemeBuyPriorityFee" class="form-label">买入优先费</label>
                                            <div class="input-group">
                                                <span class="input-group-text"><i class="bi bi-lightning-charge"></i></span>
                                                <input type="number" class="form-control" id="newSchemeBuyPriorityFee" min="0" value="1000">
                                            </div>
                                        </div>
                                    </div>
                                    <div class="col-md-4">
                                        <div class="mb-3">
                                            <label for="newSchemeBuyTipFee" class="form-label">买入小费</label>
                                            <div class="input-group">
                                                <span class="input-group-text"><i class="bi bi-coin"></i></span>
                                                <input type="number" class="form-control" id="newSchemeBuyTipFee" min="0" value="0">
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        
                        <!-- 卖出参数卡片 -->
                        <div class="card mb-4 border-danger">
                            <div class="card-header bg-danger bg-opacity-10">
                                <h6 class="mb-0"><i class="bi bi-cart-dash me-2 text-danger"></i>卖出参数</h6>
                            </div>
                            <div class="card-body">
                                <div class="row">
                                    <div class="col-md-4">
                                        <div class="mb-3">
                                            <label for="newSchemeSellDelayTime" class="form-label">卖出延迟时间 (毫秒)</label>
                                            <div class="input-group">
                                                <span class="input-group-text"><i class="bi bi-clock"></i></span>
                                                <input type="number" class="form-control" id="newSchemeSellDelayTime" min="0" value="0">
                                            </div>
                                        </div>
                                    </div>
                                    <div class="col-md-4">
                                        <div class="mb-3">
                                            <label for="newSchemeSellSlippage" class="form-label">卖出滑点 (0-1)</label>
                                            <div class="input-group">
                                                <span class="input-group-text"><i class="bi bi-sliders"></i></span>
                                                <input type="number" class="form-control" id="newSchemeSellSlippage" min="0" step="0.1" value="1">
                                                <span class="input-group-text"></span>
                                            </div>
                                        </div>
                                    </div>
                                  
                                  
                                </div>
                                
                                <div class="row">
                                  
                                    <div class="col-md-4">
                                        <div class="mb-3">
                                            <label for="newSchemeSellPriorityFee" class="form-label">卖出优先费</label>
                                            <div class="input-group">
                                                <span class="input-group-text"><i class="bi bi-lightning-charge"></i></span>
                                                <input type="number" class="form-control" id="newSchemeSellPriorityFee" min="0" value="1000">
                                            </div>
                                        </div>
                                    </div>
                                    <div class="col-md-4">
                                        <div class="mb-3">
                                            <label for="newSchemeSellTipFee" class="form-label">卖出小费</label>
                                            <div class="input-group">
                                                <span class="input-group-text"><i class="bi bi-coin"></i></span>
                                                <input type="number" class="form-control" id="newSchemeSellTipFee" min="0" value="0">
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        
                        <div class="form-check mb-3">
                            <input class="form-check-input" type="checkbox" id="newSchemeIsDefault">
                            <label class="form-check-label" for="newSchemeIsDefault">
                                <i class="bi bi-star-fill text-warning me-1"></i> 设为默认参数模板
                            </label>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal"><i class="bi bi-x-circle me-1"></i>取消</button>
                    <button type="button" class="btn btn-primary" id="saveNewSchemeBtn"><i class="bi bi-save me-1"></i>创建模板</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/dashboard.js"></script>
</body>
</html>
