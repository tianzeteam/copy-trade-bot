<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Copy Trade Bot - 控制面板</title>
    <link rel="stylesheet" href="/static/css/styles.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>
    <!-- 顶部导航栏 -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="#">Copy Trade Bot</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="#"></a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#" id="walletManagementLink">钱包管理</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#" id="tradeSettingsLink">交易设置</a>
                    </li>
                </ul>
                <div class="d-flex align-items-center">
                    <span class="text-light me-3" id="currentUser"></span>
                    <button class="btn btn-outline-light" id="logoutBtn">
                        <i class="bi bi-box-arrow-right"></i> 退出
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <!-- 钱包选择与管理 -->
        <div class="card mb-4" id="walletManagementSection">
            <div class="card-header d-flex justify-content-between align-items-center">
                <h5 class="mb-0">钱包列表</h5>
                <button type="button" class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#addWalletModal">
                    <i class="bi bi-plus-circle"></i> 添加钱包
                </button>
            </div>
            <div class="card-body">
                <!-- 钱包选择下拉菜单 -->
                <div class="mb-3">
                    <label for="walletSelect" class="form-label">选择监控钱包</label>
                    <select class="form-select" id="walletSelect">
                        <!-- 钱包选项将通过JS动态加载 -->
                    </select>
                </div>
                
                <!-- 钱包信息卡片 -->
                <div id="walletInfo" class="d-none">
                    <div class="card">
                        <div class="card-body">
                            <h5 class="card-title" id="walletName"></h5>
                            <h6 class="card-subtitle mb-2 text-muted" id="walletAddress"></h6>
                            <p class="card-text">钱包类型: <span id="walletType"></span></p>
                            
                            <div class="row mt-4">
                                <div class="col-md-4">
                                    <div class="form-group">
                                        <label for="takeProfitPct" class="form-label">止盈百分比 (%)</label>
                                        <div class="input-group">
                                            <input type="number" class="form-control" id="takeProfitPct" min="1" value="100">
                                            <span class="input-group-text">%</span>
                                        </div>
                                    </div>
                                </div>
                                <div class="col-md-4">
                                    <div class="form-group">
                                        <label for="stopLossPct" class="form-label">止损百分比 (%)</label>
                                        <div class="input-group">
                                            <input type="number" class="form-control" id="stopLossPct" min="1" value="10">
                                            <span class="input-group-text">%</span>
                                        </div>
                                    </div>
                                </div>
                                <div class="col-md-4">
                                    <div class="form-group">
                                        <label for="exitTimeSec" class="form-label">持仓时间 (秒)</label>
                                        <div class="input-group">
                                            <input type="number" class="form-control" id="exitTimeSec" min="1" value="300">
                                            <span class="input-group-text">秒</span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            
                            <div class="form-check mt-3">
                                <input class="form-check-input" type="checkbox" id="walletEnabled" checked>
                                <label class="form-check-label" for="walletEnabled">
                                    启用此钱包监控
                                </label>
                            </div>
                            
                            <div class="mt-4">
                                <button type="button" class="btn btn-danger me-2" id="deleteWalletBtn">
                                    <i class="bi bi-trash"></i> 删除钱包
                                </button>
                                <button type="button" class="btn btn-primary" id="updateWalletBtn">
                                    <i class="bi bi-save"></i> 保存更改
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
                
                <!-- 无钱包提示 -->
                <div id="noWalletAlert" class="alert alert-warning d-none">
                    没有可用的钱包。请添加一个新钱包。
                </div>
            </div>
        </div>
        
        <!-- 交易开关设置 -->
        <div class="card mb-4" id="tradeSettingsSection">
            <div class="card-header d-flex justify-content-between align-items-center">
                <h5 class="mb-0">交易开关设置</h5>
            </div>
            <div class="card-body">
                <div class="row">
                    <div class="col-md-4">
                        <div class="form-check form-switch">
                            <input class="form-check-input" type="checkbox" id="pumpTradeEnable">
                            <label class="form-check-label" for="pumpTradeEnable">
                                Pump 交易开关
                            </label>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="form-check form-switch">
                            <input class="form-check-input" type="checkbox" id="pumpAmmTradeEnable">
                            <label class="form-check-label" for="pumpAmmTradeEnable">
                                Pump AMM 交易开关
                            </label>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="form-check form-switch">
                            <input class="form-check-input" type="checkbox" id="raydiumTradeEnable">
                            <label class="form-check-label" for="raydiumTradeEnable">
                                Raydium 交易开关
                            </label>
                        </div>
                    </div>
                </div>
                
                <div class="row mt-4">
                    <div class="col-md-6">
                        <div class="card">
                            <div class="card-header">
                                <h6 class="mb-0"><i class="bi bi-water me-2"></i>池子大小范围</h6>
                            </div>
                            <div class="card-body">
                                <div class="row">
                                    <div class="col-md-6">
                                        <div class="form-group">
                                            <label for="minPoolSize" class="form-label">最小池子大小 (SOL)</label>
                                            <input type="number" class="form-control" id="minPoolSize" min="0" step="0.1">
                                        </div>
                                    </div>
                                    <div class="col-md-6">
                                        <div class="form-group">
                                            <label for="maxPoolSize" class="form-label">最大池子大小 (SOL)</label>
                                            <input type="number" class="form-control" id="maxPoolSize" min="0" step="0.1">
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="col-md-6">
                        <div class="card">
                            <div class="card-header">
                                <h6 class="mb-0"><i class="bi bi-cash-stack me-2"></i>跟单金额范围</h6>
                            </div>
                            <div class="card-body">
                                <div class="row">
                                    <div class="col-md-6">
                                        <div class="form-group">
                                            <label for="minFollowTriggerAmount" class="form-label">最小跟单金额 (SOL)</label>
                                            <input type="number" class="form-control" id="minFollowTriggerAmount" min="0" step="0.1">
                                        </div>
                                    </div>
                                    <div class="col-md-6">
                                        <div class="form-group">
                                            <label for="maxFollowTriggerAmount" class="form-label">最大跟单金额 (SOL)</label>
                                            <input type="number" class="form-control" id="maxFollowTriggerAmount" min="0" step="0.1">
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="row mt-4">
                    <div class="col-md-6">
                        <div class="card">
                            <div class="card-header">
                                <h6 class="mb-0"><i class="bi bi-cart-plus me-2 text-success"></i>买入设置</h6>
                            </div>
                            <div class="card-body">
                                <div class="row">
                                    <div class="col-md-6">
                                        <div class="form-group">
                                            <label for="buySlippage" class="form-label">买入滑点 (0-1)</label>
                                            <input type="number" class="form-control" id="buySlippage" min="0" max="1" step="0.01">
                                        </div>
                                    </div>
                                    <div class="col-md-6">
                                        <div class="form-group">
                                            <label for="buySolAmount" class="form-label">买入金额 (SOL)</label>
                                            <input type="number" class="form-control" id="buySolAmount" min="0" step="0.01">
                                        </div>
                                    </div>
                                </div>
                                <div class="row mt-3">
                                    <div class="col-md-6">
                                        <div class="form-group">
                                            <label for="buyPriorityFee" class="form-label">优先费 (SOL)</label>
                                            <input type="number" class="form-control" id="buyPriorityFee" min="0" step="0.000001">
                                        </div>
                                    </div>
                                    <div class="col-md-6">
                                        <div class="form-group">
                                            <label for="buyTipFee" class="form-label">小费 (SOL)</label>
                                            <input type="number" class="form-control" id="buyTipFee" min="0" step="0.000001">
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="col-md-6">
                        <div class="card">
                            <div class="card-header">
                                <h6 class="mb-0"><i class="bi bi-cart-dash me-2 text-danger"></i>卖出设置</h6>
                            </div>
                            <div class="card-body">
                                <div class="row">
                                    <div class="col-md-6">
                                        <div class="form-group">
                                            <label for="sellSlippage" class="form-label">卖出滑点 (0-1)</label>
                                            <input type="number" class="form-control" id="sellSlippage" min="0" max="1" step="0.01">
                                        </div>
                                    </div>
                                    <div class="col-md-6">
                                        <div class="form-group">
                                            <label for="sellDelayTime" class="form-label">卖出延迟时间 (毫秒)</label>
                                            <input type="number" class="form-control" id="sellDelayTime" min="0" step="1000" placeholder="例如：6000 表示6秒">
                                        </div>
                                    </div>
                                </div>
                                <div class="row mt-3">
                                    <div class="col-md-6">
                                        <div class="form-group">
                                            <label for="sellPriorityFee" class="form-label">优先费 (SOL)</label>
                                            <input type="number" class="form-control" id="sellPriorityFee" min="0" step="0.000001">
                                        </div>
                                    </div>
                                    <div class="col-md-6">
                                        <div class="form-group">
                                            <label for="sellTipFee" class="form-label">小费 (SOL)</label>
                                            <input type="number" class="form-control" id="sellTipFee" min="0" step="0.000001">
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="mt-4">
                    <button type="button" class="btn btn-primary" id="saveTradeSettingsBtn">
                        <i class="bi bi-save"></i> 保存交易设置
                    </button>
                </div>
            </div>
        </div>
        
        <div class="alert alert-success mt-3 d-none" id="successAlert">
            操作成功！
        </div>
        
        <div class="alert alert-danger mt-3 d-none" id="errorAlert">
            操作失败！请检查输入并重试。
        </div>
    </div>

    <!-- 添加钱包模态框 -->
    <div class="modal fade" id="addWalletModal" tabindex="-1" aria-labelledby="addWalletModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="addWalletModalLabel">添加新钱包</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="addWalletForm">
                        <div class="mb-3">
                            <label for="newWalletAddress" class="form-label">钱包地址</label>
                            <input type="text" class="form-control" id="newWalletAddress" required>
                            <div class="form-text">输入有效的Solana钱包地址</div>
                        </div>
                        <div class="mb-3">
                            <label for="newWalletName" class="form-label">钱包名称</label>
                            <input type="text" class="form-control" id="newWalletName" required>
                        </div>
                        <div class="mb-3">
                            <label for="newWalletType" class="form-label">钱包类型</label>
                            <select class="form-select" id="newWalletType" required>
                                <option value="high_frequency">高频交易</option>
                                <option value="low_frequency">低频交易</option>
                            </select>
                        </div>
                        <div class="row">
                            <div class="col-md-4">
                                <div class="mb-3">
                                    <label for="newTakeProfitPct" class="form-label">止盈 (%)</label>
                                    <input type="number" class="form-control" id="newTakeProfitPct" min="1" value="100" required>
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="mb-3">
                                    <label for="newStopLossPct" class="form-label">止损 (%)</label>
                                    <input type="number" class="form-control" id="newStopLossPct" min="1" value="10" required>
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="mb-3">
                                    <label for="newExitTimeSec" class="form-label">持仓时间 (秒)</label>
                                    <input type="number" class="form-control" id="newExitTimeSec" min="1" value="300" required>
                                </div>
                            </div>
                        </div>
                        <div class="form-check mb-3">
                            <input class="form-check-input" type="checkbox" id="newWalletEnabled" checked>
                            <label class="form-check-label" for="newWalletEnabled">
                                启用此钱包监控
                            </label>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-primary" id="saveNewWalletBtn">添加钱包</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/dashboard.js"></script>
</body>
</html>
